<h1>Our Philosophy</h1>

<p>
We travel thinking we are searching for places.
</p>

<p>
In reality, we are searching for connections.
</p>

<p>
Mountains, cities, deserts, and oceans become the backdrop
of something far more meaningful:
the moments when two souls meet and recognize one another.
</p>

<p>
Fragments of the Soul is a collection of those encounters.
</p>

<p>
A celebration of the awe of human connection that transcends
borders, cultures, language, space, and time.
</p>
